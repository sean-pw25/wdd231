    <!-- open graph metadata -->
    <meta property="og:title" content="Contact | RedEmber Web Design | Ignite Your Online Presence">
    <meta property="og:description"
        content="Welcome to our contact page. Here you can input your information and we will get back to you as soon as possible!">
    <meta property="og:url" content="https://sean-pw25.github.io/wdd231/project/contact.html">
    <meta property="og:locale" content="en_US">
    <meta property="og:image" content="images/logo/red-ember-vertical-dark-mode.png">

    <!-- twitter (x) metadata -->

        content="Welcome to our contact page. Here you can input your information and we will get back to you as soon as possible!">
    <meta property="twitter:url" content="https://sean-pw25.github.io/wdd231/project/contact.html">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:image" content="images/logo/red-ember-vertical-dark-mode.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/medium.css">
    <link rel="stylesheet" href="styles/large.css">

    <!-- Javascript -->
    <script type="module" src="scripts/global.js"></script>
</head>

<body>
    <header>
        <div class="header-bar">
            <a class="header-logo" href="index.html" aria-label="Home">
                <img id="headerLogo" src="images/logo/red-ember-horizontal.png" width="184" height="48" loading="lazy"
                    alt="RedEmber Web Design Logo"></a>
            <button id="hamButton" class="hamburger-button" aria-label="Toggle Navigation Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
        <nav class="navigation" id="nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
            <button id="darkModeButton" class="dark-mode-button" aria-label="Toggle Dark Mode"
                title="Toggle Dark Theme"><img id="darkModeIcon" src="images/global/dark-theme.svg"
                    alt="Toggle dark mode" width="40" height="40" loading="lazy"></button>
        </nav>
    </header>
    <main>
        <section class="contact">
            <div>
                <h1 class="text-center">Contact Us</h1>
                <img class="pad" src="images/contact.jpg" alt="Person with laptop using a cell phone" loading="lazy">
            </div>
            <form method="get" action="thankyou.html" class="border">
                <fieldset class="personal-info font-small">
                    <legend class="font-medium">Personal Information</legend>
                    <label class="required" for="firstName">First Name</label>
                    <input class="border" id="firstName" type="text" name="fname" required>
                    <label class="required" for="lastName">Last Name</label>
                    <input class="border" id="lastName" type="text" name="lname" required>
                    <label for="phone">Phone Number</label>
                    <input class="border" id="phone" type="tel" name="phone" required>
                    <label class="required" for="email">Email</label>
                    <input class="border" id="email" type="email" name="email" required>
                    <label for="organization">Organization</label>
                    <input class="border" id="organization" type="text" name="organization">
                </fieldset>
                <fieldset class="reason font-small">
                    <legend class="required font-medium">Reason for Contact</legend>
                    <label>Quote
                        <input type="radio" name="reason" value="quote" required></label>
                    <label>Inquiry
                        <input type="radio" name="reason" value="inquiry" required></label>
                    <label>Service
                        <input type="radio" name="reason" value="service-request" required></label>
                </fieldset>
                <fieldset class="other font-small">
                    <label for="message">Message</label>
                    <textarea id="message" rows="3" name="message" title="Message"></textarea>
                    <label class="checkbox pad">Receive Emails for News and Offers
                        <input type="checkbox" name="newsletter"></label>
                    <input type="hidden" name="timestamp" id="timeStamp">
                    <input class="submit border pad" type="submit" value="Submit">
                </fieldset>
            </form>
        </section>
    </main>
    <footer class="text-center">
        <div class="site-links">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
        <a href="#top" class="scroll-button">^</a>
        <div class="footer-grid">
            <div class="social">
                <p>Follow Us</p>
                <ul>
                    <li>
                        <a href="https://www.facebook.com" target="_blank" rel="noopener"><img
                                src="images/global/social/facebook.svg" alt="Facebook logo" loading="lazy"></a>
                    </li>
                    <li>
                        <a href="https://www.youtube.com" target="_blank" rel="noopener"><img
                                src="images/global/social/youtube.svg" alt="Youtube logo" loading="lazy"></a>
                    </li>
                    <li>
                        <a href="https://www.linkedin.com" target="_blank" rel="noopener"><img
                                src="images/global/social/linkedin.svg" alt="Linkedin logo" loading="lazy"></a>
                    </li>
                    <li>
                        <a href="https://www.github.com" target="_blank" rel="noopener"><img
                                src="images/global/social/github.svg" alt="Github logo" loading="lazy"></a>
                    </li>
                    <li>
                        <a href="https://www.tiktok.com" target="_blank" rel="noopener"><img
                                src="images/global/social/tiktok.svg" alt="Tiktok logo" loading="lazy"></a>
                    </li>
                </ul>
            </div>
            <div class="left">
                <p id="copyright"></p>
                <p>Sean Wood</p>
            </div>
            <div class="right">
                <p>WDD231 Class Project</p>
                <p>BYU-Pathway Worldwide</p>
                <a href="#" class="demonstration">Demonstration Video</a>
            </div>
        </div>
    </footer>
    <script>
        const formLoadTime = new Date();
        const timeStamp = document.getElementById('timeStamp').setAttribute('value', `${formLoadTime.toLocaleString()}`);
    </script>
</body>

</html>
