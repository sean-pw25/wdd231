<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations | WDD231</title>
    <meta name="description"
        content="A simple webpage showing my work using CSS Animations to complete the assignment for WDD231 titled 'CSS Animations and Transitions'">
    <meta name="author" content="Sean Wood">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <main>
        <h1>CSS Animations and Transitions</h1>
        <section>
            <h2>Example #1</h2>
            <p>Below is an example of using the <strong>animation</strong> shorthand, <strong>@keyframes</strong>, and
                <strong>transform</strong> to create a loading animation
            </p>
            <div class="animation-container">
                <div class="loader1"></div>
            </div>
        </section>
        <section>
            <h2>Example #2</h2>
            <p>Below is an example of using the <strong>transition</strong> property to create an animation which
                activates when the user hovers over the image.
            </p>
            <div class="animation-container">
                <div class="loader2"></div>
            </div>
        </section>
    </main>
</body>

</html>
